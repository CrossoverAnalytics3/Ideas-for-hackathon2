<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Sample worksheet</title>
<style>
body{margin:0;background:#888;display:grid;place-items:center;min-height:100vh;font-family:"Liberation Serif","Times New Roman",serif}
.sheet{width:640px;background:#fdfcf7;padding:44px 52px;box-shadow:0 10px 40px rgba(0,0,0,.35);color:#222;position:relative;transform:rotate(-0.6deg)}
h1{font-size:22px;margin:0 0 4px;font-weight:700}
.meta{font-size:13px;color:#555;margin-bottom:26px;display:flex;justify-content:space-between}
.meta i{font-family:"DejaVu Sans",sans-serif;font-style:normal}
ol{margin:0;padding-left:26px;font-size:24px;line-height:2.3}
li{position:relative}
.hand{font-family:"DejaVu Sans",sans-serif;color:#2b3a8f;font-size:24px;margin-left:16px;letter-spacing:.5px;transform:rotate(-1.5deg);display:inline-block;position:relative;top:2px}
.hand.wob{transform:rotate(1.2deg) translateY(1px)}
.x{position:absolute;right:120px;top:2px;color:#d22;font-size:34px;font-weight:700;font-family:"DejaVu Sans",sans-serif;transform:rotate(8deg)}
.ck{position:absolute;right:124px;top:4px;color:#2a8a3a;font-size:30px;font-weight:700;transform:rotate(-6deg)}
.score{position:absolute;right:56px;top:96px;color:#d22;font-size:30px;font-weight:700;border:3px solid #d22;border-radius:50%;padding:8px 10px;transform:rotate(-12deg);font-family:"DejaVu Sans",sans-serif}
.foot{margin-top:28px;font-size:14px;color:#d22;font-family:"DejaVu Sans",sans-serif;transform:rotate(-1deg)}
</style></head>
<body><div class="sheet">
  <h1>Fractions &amp; decimals — Quiz 4</h1>
  <div class="meta"><span>Name: <i>Maya</i></span><span>Grade 5 · Sept 4</span></div>
  <div class="score">1 / 4</div>
  <ol>
    <li>1/2 + 1/3 = <span class="hand">2/5</span><span class="x">✗</span></li>
    <li>3/4 − 1/2 = <span class="hand wob">1/4</span><span class="ck">✓</span></li>
    <li>1/4 + 1/2 = <span class="hand">2/4</span><span class="x">✗</span></li>
    <li>Which is bigger: 0.7 or 0.45? <span class="hand wob">0.45</span><span class="x">✗</span></li>
  </ol>
  <div class="foot">Maya — remember the bottoms have to match! See me.</div>
</div></body></html>
